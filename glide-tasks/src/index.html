<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6fa"><meta name="description" content="すぐ書ける、フリックで管理するタスクアプリ"><title>Glide</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><style>/*CSS*/</style></head>
<body>
<div id="boot" aria-hidden="true"><div class="sk-side"><i></i><i></i><i></i></div><div class="sk-main"><i class="sk-title"></i><i class="sk-input"></i><i></i><i></i><i></i></div></div>
<div class="ambient a1"></div><div class="ambient a2"></div><div class="ambient a3"></div>
<aside class="sidebar glass"><a class="brand" href="/" aria-label="Glide ホーム"><span class="logo">g</span>Glide<span class="brand-dot"></span></a><nav aria-label="メイン"><button class="nav-item active" data-view="all"><span data-icon="layers"></span>すべてのタスク<b id="sideCount">0</b></button><button class="nav-item" data-view="doing"><span data-icon="activity"></span>進行中<b id="doingCount">0</b></button><button class="nav-item" data-view="done"><span data-icon="check"></span>完了<b id="doneCount">0</b></button></nav><div class="side-bottom"><div class="storage-state"><span class="status-dot"></span><span id="storageLabel">この端末に保存</span></div><button class="account-button" id="accountBtn"><span class="avatar" data-icon="user"></span><span id="accountLabel">アカウント</span><span data-icon="chevron"></span></button></div></aside>
<main>
<header><div class="mobile-brand"><span class="logo">g</span>Glide</div><div class="date-line" id="todayLabel"></div><div class="header-actions"><button class="icon-button" id="searchBtn" aria-label="タスクを検索"><span data-icon="search"></span></button><button class="icon-button" id="settingsBtn" aria-label="設定"><span data-icon="settings"></span></button></div></header>
<section class="title-row"><div><div class="eyebrow">MY TASKS</div><h1 id="pageTitle">すべてのタスク<span id="totalCount">0</span></h1></div><div class="progress-ring" id="progressRing" role="img" aria-label="完了率 0%"><span id="progressText">0<span>%</span></span></div></section>
<form id="capture" class="capture glass"><label class="sr-only" for="quickNote">タスクを入力</label><textarea id="quickNote" placeholder="いま、やることは？" autofocus rows="2" maxlength="2000" enterkeyhint="done"></textarea><div class="capture-bottom"><div class="capture-tools"><label class="chip date-chip" title="期限"><span data-icon="calendar"></span><span id="dueLabel">期限</span><input type="date" id="quickDue" aria-label="タスクの期限"></label><button type="button" class="chip" id="priorityBtn" aria-pressed="false"><span data-icon="flag"></span><span id="priorityLabel">優先度</span></button><button type="button" class="chip ai-chip" id="aiBtn"><span data-icon="sparkles"></span><span>AIで分解</span></button></div><button class="add-button" type="submit" id="addBtn" aria-label="タスクを追加" disabled><span data-icon="arrow-up"></span></button></div><div class="capture-meta"><span id="draftState">&nbsp;</span><span class="key-hint">Enter で追加 <kbd>↵</kbd></span></div></form>
<div class="search-wrap" id="searchWrap" hidden><span data-icon="search"></span><input type="search" id="searchInput" placeholder="タスクを検索" aria-label="検索キーワード"><button class="icon-button" id="searchClose" aria-label="検索を閉じる"><span data-icon="x"></span></button></div>
<section class="list-section"><div class="list-toolbar"><div class="tabs" role="tablist" aria-label="ステータス"><button role="tab" aria-selected="true" data-filter="all">すべて<span id="allBadge">0</span></button><button role="tab" aria-selected="false" data-filter="doing">進行中<span id="doingBadge">0</span></button><button role="tab" aria-selected="false" data-filter="done">完了<span id="doneBadge">0</span></button></div><button class="sort-button" id="sortBtn" aria-label="並べ替え：追加順"><span data-icon="sort"></span><span id="sortLabel">追加順</span></button></div><div class="swipe-legend"><span><span data-icon="arrow-left"></span> 着手</span><span>完了 <span data-icon="arrow-right"></span></span></div><div id="taskList" aria-label="タスク一覧"></div><div class="empty-state" id="emptyState"><div class="empty-symbol"><span data-icon="check"></span><span class="mini-spark">✧</span></div><p id="emptyLabel">タスクはありません</p></div></section>
<footer><span id="syncLabel">端末内</span><span class="footer-dot">·</span><span id="taskSummary">0 件のタスク</span><button id="shortcutBtn" aria-label="操作方法"><span data-icon="help"></span></button></footer>
</main>
<nav class="mobile-nav glass" aria-label="モバイルナビゲーション"><button class="active" data-view="all"><span data-icon="layers"></span><span>すべて</span></button><button data-view="doing"><span data-icon="activity"></span><span>進行中</span></button><button data-view="done"><span data-icon="check"></span><span>完了</span></button><button id="mobileAccount"><span data-icon="user"></span><span>アカウント</span></button></nav>
<div class="toast glass" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="undoBtn">取り消す</button></div>
<dialog id="detailDialog" class="sheet glass"><form id="detailForm"><div class="sheet-head"><h2>タスク</h2><button type="button" class="icon-button" data-close aria-label="閉じる"><span data-icon="x"></span></button></div><label class="field-label" for="editTitle">内容</label><textarea id="editTitle" rows="4" maxlength="2000" required></textarea><div class="edit-grid"><label>ステータス<select id="editStatus"><option value="todo">未着手</option><option value="doing">進行中</option><option value="done">完了</option></select></label><label>期限<input type="date" id="editDue"></label></div><label class="check-field"><input type="checkbox" id="editPriority">優先する</label><div class="sheet-actions"><button type="button" id="deleteBtn" class="danger-button"><span data-icon="trash"></span>削除</button><button type="submit" class="primary-button">保存</button></div></form></dialog>
<dialog id="settingsDialog" class="sheet glass"><div class="sheet-head"><h2>アカウント・設定</h2><button class="icon-button" data-close aria-label="閉じる"><span data-icon="x"></span></button></div><div class="account-summary"><span class="large-avatar" data-icon="user"></span><div><strong id="profileName">この端末</strong><p id="profileDetail">タスクはこのブラウザに保存されます</p></div></div><button class="google-button" id="googleLogin"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#4285f4" d="M21.6 12.2c0-.7-.1-1.5-.2-2.2H12v4h5.4a4.6 4.6 0 0 1-2 3v2.5h3.3c1.9-1.8 2.9-4.3 2.9-7.3Z"/><path fill="#34a853" d="M12 22c2.7 0 5-.9 6.7-2.5L15.4 17c-.9.6-2 .9-3.4.9-2.6 0-4.8-1.8-5.6-4.1H3v2.6A10 10 0 0 0 12 22Z"/><path fill="#fbbc05" d="M6.4 13.8a6 6 0 0 1 0-3.6V7.6H3a10 10 0 0 0 0 8.8Z"/><path fill="#ea4335" d="M12 6.1c1.5 0 2.8.5 3.9 1.5l2.9-2.9A9.6 9.6 0 0 0 12 2a10 10 0 0 0-9 5.6l3.4 2.6C7.2 7.9 9.4 6.1 12 6.1Z"/></svg><span>Googleでログイン</span></button><p class="setting-note" id="authNote"></p><button class="secondary-button" id="importBtn" hidden>端末のタスクを取り込む</button><button class="secondary-button" id="logoutBtn" hidden>ログアウト</button><div class="setting-divider"></div><div class="setting-row"><span><span data-icon="sparkles"></span>AIでタスクを分解</span><span class="availability" id="aiAvailability">確認中</span></div><p class="setting-note">入力した内容をAIに送信し、候補を確認してから追加します。</p><div class="setting-divider"></div><button class="setting-row plain" id="exportBtn"><span><span data-icon="download"></span>タスクを書き出す</span><span data-icon="chevron"></span></button><div class="setting-divider"></div><div class="setting-row"><span>アニメーション</span><button class="toggle" id="motionBtn" role="switch" aria-checked="true" aria-label="アニメーション"><i></i></button></div><div class="version">Glide · 1.0</div></dialog>
<dialog id="aiDialog" class="sheet glass"><div class="sheet-head"><h2>AIで分解</h2><button class="icon-button" data-close aria-label="閉じる"><span data-icon="x"></span></button></div><div id="aiResults"></div><button class="primary-button full-width" id="acceptAi">選択したタスクを追加</button></dialog>
<dialog id="helpDialog" class="sheet glass"><div class="sheet-head"><h2>操作方法</h2><button class="icon-button" data-close aria-label="閉じる"><span data-icon="x"></span></button></div><div class="help-row"><span data-icon="arrow-right"></span><div>右へフリック<small>完了にする・完了を戻す</small></div></div><div class="help-row"><span data-icon="arrow-left"></span><div>左へフリック<small>進行中にする・未着手に戻す</small></div></div><div class="help-row"><span data-icon="edit"></span><div>タスクをタップ<small>編集・期限・ステータス・削除</small></div></div><div class="help-row"><kbd>↵</kbd><div>Enterで追加<small>Shift + Enterで改行</small></div></div></dialog>
<script>/*JS*/</script></body></html>
