name: Glide Cloudflare deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glide-tasks
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build && npm test && npm run validate
      - name: Configure D1
        env:
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          node --input-type=module -e "import fs from 'node:fs';const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));if(!process.env.D1_DATABASE_ID)throw new Error('CLOUDFLARE_D1_DATABASE_ID is required');c.d1_databases[0].database_id=process.env.D1_DATABASE_ID;fs.writeFileSync('wrangler.runtime.json',JSON.stringify(c));"
      - name: Migrate and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 migrations apply DB --remote --config wrangler.runtime.json
          npx --yes wrangler@4 deploy --config wrangler.runtime.json
